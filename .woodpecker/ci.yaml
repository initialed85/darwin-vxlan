# darwin-vxlan is macOS-only: it links vmnet.framework, and `cargo check --features vmnet-mock` on Linux
# fails with 38 E0433 errors (the vmnet bindings are `#[cfg(target_os = "macos")]`). Every step here has
# to land on the Mac runner, so the whole workflow is pinned to it.
#
# THE PIN IS `labels.platform`, NOT `when.platform`.
#
# `when: - platform: darwin/arm64` looks like the right thing and is in the JSON schema, but it is
# evaluated at compile time on the server, and the server's metadata has `Sys.Platform` hardcoded to the
# empty string (server/pipeline/metadata/metadata.go:112, "will be set by pipeline platform option or by
# agent" - the pipeline option is gone in v3 and model.Workflow.Platform is never written). Constraint
# matching then does `List{Include:["darwin/arm64"]}.Match("")`, which returns false, so the step is
# dropped from the compiled workflow and the pipeline "succeeds" having run nothing. Silent.
#
# The mechanism that actually works is the workflow label: the agent registers with the default label
# `platform=darwin/arm64` (cmd/agent/core/agent.go:233) and the scheduler requires every task label to
# be present on the agent (server/scheduler/filter.go). Setting `labels.platform` here therefore makes
# the Mac the only agent that can take the task. It is also exactly what the docs describe for workflow
# labels, minus the fact that the docs claim a `platform` attribute exists.
#
# The runner is icarus-2.local: backend `local`, capacity 1. The local backend does not run containers -
# it uses the step's `image` as the NAME OF THE SHELL to run the commands in (pipeline/backend/local/
# command.go: "execCommands use step.Image as shell"; genCmdByShell accepts sh, bash and zsh, and probes
# anything else as a posix shell). So `image: docker.io/library/rust:1.99.1` on a Mac step fails with
# `exec: "docker.io/library/rust:1.99.1": stat ...: no such file or directory`, which is exactly how this
# workflow failed on its first run. The image is a shell name here, and cargo/rustup are host
# tools on icarus, not container ones.
#
# Ported from .github/workflows/ci.yml, which this replaces, with one job dropped on purpose: the
# x86_64-apple-darwin / Catalina leg. The Intel promise went into the too-hard basket - the old Intel MacBook
# never came back up - and a cross-compile that produces a binary nobody can run is a chore, not a guarantee.
# The leg is in git history with the MACOSX_DEPLOYMENT_TARGET=10.15 and -Werror=unguarded-availability-new
# settings that made it honest, for the day a working Intel Mac turns up.

labels:
  platform: darwin/arm64

steps:
  - name: check
    image: bash
    commands:
      - rustc --version
      - cargo fmt -- --check
      # vmnet-mock is the only feature in the manifest, so --all-features is the stub build: real
      # vmnet.framework replaced by a pure-C stub with real pipes, no hardware and no root required.
      - cargo test --all-features
      - cargo check --all-features

when:
  - event: push
    branch: [develop, main]
  - event: pull_request
