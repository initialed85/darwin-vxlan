# Throwaway probe (deleted once answered). One question now blocks every darwin release workflow: can a
# step on this lane authenticate to GitHub at all?
#
# The cluster-side answers are all closed. v3 has no top-level secrets: key, and a named Secret reaches a
# workflow only through a plugin step's settings: {from_secret: name} (compiler/settings/params.go:179 via
# compiler/convert.go:106); a plugin-shaped step cannot run on the local backend because image: resolves to
# a shell; backend_options.kubernetes.secrets has nothing to attach to because this lane has no step pods.
# The last option - GH_TOKEN on the agent Deployment via secretKeyRef - was applied and measured: maclet
# refuses it, the pod goes to RunContainerError with `environment variable "GH_TOKEN" uses an unsupported
# valueFrom source`, and it took the lane down until it was reverted. Volume mounts are inert here too.
#
# What is left is the host: steps are child processes of the agent (local.go builds cmd.Env from
# os.Environ()) and they see the host filesystem. Measured on run 7: gh 2.96.0 is on PATH and NOT
# authenticated - no GH_TOKEN, `You are not logged into any GitHub hosts`, and `gh api` answers `To use
# GitHub CLI in automation, set the GH_TOKEN environment variable`. So a darwin release step has no
# credential today. This run measures who a step runs as, what HOME it gets, and whether a file under the
# agent's own config directory - the route WOODPECKER_AGENT_SECRET_FILE already uses - is reachable from a
# step, which is the only way left to hand this lane a GitHub token.
#
# Presence, identity and permissions only - never a token value.
labels:
  platform: darwin/arm64

steps:
  - name: toolchain-inventory
    image: bash
    commands:
      - uname -sr && pwd
      - sw_vers 2>/dev/null | tr '\n' ' '
      - echo agent-inherited WOODPECKER vars, present only in the agent process, not in the metadata env
      - env | sed -n 's/^\(WOODPECKER_[A-Z_]*\)=.*/\1/p' | sort
      - for c in curl jq gh docker python3 git pkgbuild codesign go swiftc make; do
          if command -v "$c" >/dev/null 2>&1; then printf 'have %s at %s\n' "$c" "$(command -v "$c")";
          else printf 'MISSING %s\n' "$c"; fi
        done
      - echo token presence checks, value never printed
      - env | awk 'BEGIN{a=0;b=0} /^GH_TOKEN=/{a=1} /^GITHUB_TOKEN=/{b=1} END{print "GH_TOKEN present", a, "GITHUB_TOKEN present", b}'
      - gh --version | head -1
      # Kept non-fatal: on run 7 the step died on `gh api` under set -e before the path checks below ran.
      - gh auth status 2>&1 | head -4 || true
      - gh api repos/initialed85/darwin-vxlan --jq .full_name 2>&1 | head -2 || true
      - env | awk '/^HOME=/{print "HOME line", $0}'
      - printf 'step runs as %s uid %s\n' "$(id -u -n)" "$(id -u)"
      - test -f "$HOME/.config/gh/hosts.yml" && echo "gh config visible at HOME/.config/gh/hosts.yml" || echo "no gh config at HOME/.config/gh/hosts.yml"
      - test -f /Users/edwardbeech/.config/gh/hosts.yml && echo "gh config visible at the host path" || echo "no gh config at the host path"
      # The agent reads its own token from this host path (WOODPECKER_AGENT_SECRET_FILE in the Deployment).
      # If a step can stat the same directory, a GitHub credential can reach a darwin step the same way.
      - ls -l /Users/edwardbeech/.config/woodpecker-agent/ 2>&1 | head -5 || echo "step cannot see the agent config directory"
      - test -f /Users/edwardbeech/.config/woodpecker-agent/agent-secret && echo "agent secret host path is readable from a step" || echo "agent secret host path NOT readable from a step"

when:
  - event: push
    branch: develop
