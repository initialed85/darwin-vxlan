# Throwaway probe: does `when: platform` ever match? Delete after reading the result.
#
# If the server compiles with Sys.Platform == "" then the `linux/amd64` step is dropped and only the
# unfiltered step runs. CI_SYSTEM_PLATFORM in the output shows what the agent reports at runtime.
steps:
  - name: unfiltered
    image: docker.io/library/alpine:3.20
    commands:
      - echo "unfiltered ran; CI_SYSTEM_PLATFORM=[$CI_SYSTEM_PLATFORM] agent=[$CI_AGENT_NAME]"

  - name: wants-linux-amd64
    image: docker.io/library/alpine:3.20
    when:
      - platform: linux/amd64
    commands:
      - 'echo "STEP WITH when-platform linux/amd64 ACTUALLY RAN"'

  - name: wants-empty
    image: docker.io/library/alpine:3.20
    when:
      - platform: ""
    commands:
      - echo "empty-string platform constraint ran"

when:
  - event: push
    branch: [develop, main]
