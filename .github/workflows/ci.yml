name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, test, and check (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests with vmnet stub
        run: cargo test --all-features

      - name: Check arm64 build
        run: cargo check --all-features

  x86_64-catalina:
    name: Cross-build Intel / macOS 10.15
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      CFLAGS: '-Werror=unguarded-availability-new'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust and Intel target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Compile Intel vmnet-mock tests
        run: cargo test --target x86_64-apple-darwin --features vmnet-mock --no-run

      - name: Build Intel release binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Verify Intel architecture and Catalina minimum
        shell: bash
        run: |
          BINARY=target/x86_64-apple-darwin/release/darwin-vxlan
          file "$BINARY" | grep -q 'Mach-O 64-bit executable x86_64'
          MIN_OS=$(otool -l "$BINARY" | awk '
            /LC_BUILD_VERSION/ { in_section=1; next }
            in_section && /minos/ { print $2; found=1; exit }
            END { if (!found) exit 1 }
          ')
          test "$MIN_OS" = '10.15'
          echo "Verified x86_64 Mach-O with minimum macOS $MIN_OS"
