name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  VERSION_INPUT: ${{ inputs.version }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            binary_arch: arm64
            deployment_target: '11.0'
          - target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            binary_arch: x86_64
            deployment_target: '10.15'
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      CFLAGS: '-Werror=unguarded-availability-new'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify architecture
        run: |
          file target/${{ matrix.target }}/release/darwin-vxlan | grep -q '${{ matrix.binary_arch }}'

      - name: Create tarball
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine release version"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          mkdir -p dist
          cp target/${{ matrix.target }}/release/darwin-vxlan dist/
          cp README.md dist/

          cd dist
          tar -czf darwin-vxlan-${{ matrix.asset }}.tar.gz darwin-vxlan README.md
          cd ..

          echo "==> Created tarball:"
          ls -lh dist/darwin-vxlan-${{ matrix.asset }}.tar.gz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.asset }}
          path: dist/darwin-vxlan-${{ matrix.asset }}.tar.gz
          retention-days: 3

  package:
    name: Package ${{ matrix.asset }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            deployment_target: '11.0'
          - target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            deployment_target: '10.15'
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      CFLAGS: '-Werror=unguarded-availability-new'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.asset }}
          path: dist/

      - name: Derive VERSION
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine release version"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Extract binary from tarball
        run: |
          mkdir -p dist/${{ matrix.asset }}
          tar -xzf dist/darwin-vxlan-${{ matrix.asset }}.tar.gz -C dist/${{ matrix.asset }}
          ls -la dist/${{ matrix.asset }}

      - name: Make build script executable
        run: chmod +x scripts/build-pkg.sh

      - name: Build .pkg
        run: |
          ./scripts/build-pkg.sh \
            dist/${{ matrix.asset }}/darwin-vxlan \
            "$VERSION" \
            dist/${{ matrix.asset }} \
            "${{ matrix.asset }}"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}/darwin-vxlan-*.pkg
          retention-days: 3

  release:
    name: Create GitHub Release
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist/
          merge-multiple: true

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist/
          merge-multiple: true

      - name: Derive VERSION
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine release version"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum darwin-vxlan-*.tar.gz darwin-vxlan-*.pkg > sha256sums.txt
          echo "==> Checksums:"
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: darwin-vxlan v${{ env.VERSION }}
          body: |
            ## Installation

            ### Apple Silicon
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/darwin-vxlan-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv darwin-vxlan /usr/local/bin/
            ```

            ### Intel / Catalina and newer
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/darwin-vxlan-x86_64-apple-darwin.tar.gz | tar xz
            sudo mv darwin-vxlan /usr/local/bin/
            ```

            ### Installer packages
            Architecture-specific `.pkg` installers are included for both
            `aarch64-apple-darwin` and `x86_64-apple-darwin`.

            ### Checksums
            See `sha256sums.txt` for verification.
          files: |
            dist/darwin-vxlan-*.tar.gz
            dist/darwin-vxlan-*.pkg
            dist/sha256sums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
